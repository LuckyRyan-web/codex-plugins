name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile hook
        run: python -m py_compile plugins/task-completion-guard/scripts/completion_guard.py

      - name: Test release package
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Test completion guard
        run: python -m unittest discover -s plugins/task-completion-guard/tests -p "test_*.py"
